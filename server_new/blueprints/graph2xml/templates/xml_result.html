<!DOCTYPE html>
<html>
<head>
    <title>多维表转流程图</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <h1>配置</h1>
  <p>
    <a href="http://www.example.com"target="_blank">使用方法</a>
    <form action="{{url_for('graph2xml.result')}}" method='post'>
      
        多维表格id: <input type="text" name="id"  maxlength="1000000000000" value="{{bitapp_id}}"
                     ><br>
        区域名(无特定区域时留空）：<input type="text" name="region"  maxlength="1000000000000" value="{{region}}"
        ><br>

        {% if rough %}
        <input
        type="checkbox"
        id="rough"
        name="rough"
        checked
         />
      <label for="rough">仅限粗骨干图</label>
{% else %}
<input
type="checkbox"
id="rough"
name="rough"

 />
<label for="rough">仅限粗骨干图</label>
{% endif %}
{% if except_cop %}
        <input
                   type="checkbox"
                   id="except_cop"
                   name="except_cop"
                   checked
                    />
                 <label for="except_cop">除去公司</label>
                 {% else %}
                 <input
                 type="checkbox"
                 id="except_cop"
                 name="except_cop"
                 
                  />
               <label for="except_cop">除去公司</label>

{% endif %}
{% if except_ind %}
        <input
                   type="checkbox"
                   id="except_ind"
                   name="except_ind"
                   checked
                    />
                 <label for="except_ind">除去指标</label>
                 {% else %}
                 <input
                 type="checkbox"
                 id="except_ind"
                 name="except_ind"
                 
                  />
               <label for="except_ind">除去指标</label>

{% endif %}
        <!-- 多维表格区域名: <br> -->
        <!--<textarea maxlength="500000000000000" rows = "3" cols = "20" name="graph"></textarea>-->
<br>
        
        <input type="submit" value="再次提交">
        </form>

</p>
    <h1>流程图文本</h1>
    <h2>可以在文本框内使用Ctrl+A(mac环境为command+A)和Ctrl+C进行全选复制</h2>
    <textarea rows="20" cols="80" id="xml-text">{{ result }}</textarea>
    

</body>
</html>
