    <script type="text/javascript">
      //页面初始化，非echarts 部分
      //初始化
      const toastLiveCommented = document.getElementById('liveToast-commented')
      const toastLiveWarning = document.getElementById('liveToast-warning')
      const toastLiveClearing = document.getElementById('liveToast-clearing')
      const toastLiveSearchResult = document.getElementById('liveToast-searched')

      function showSearchResult(x, y) {
        var toastInsSearchResult = new bootstrap.Toast(toastLiveSearchResult);
        $("#toast-search-result").text("本次搜索新增 " + x + " 个点和 " + y + " 条关系");
        toastInsSearchResult.show();
      }

      function confirmClear(event) {
        const toast3 = new bootstrap.Toast(toastLiveClearing);
        toast3.show();
      }
      // go Comment
      function goComment(event) {
        var comment = $("#commentTextarea1").val();
        if (comment.length < 10) {
          const toast2 = new bootstrap.Toast(toastLiveWarning);
          toast2.show();
          return
        }
        console.log(event);
        console.log(comment);

        var selected_nl = extract_selected_nl();
        $.post("/comment/write_comment",
          { content: comment, node_name: selected_nl.node_name, link_name: selected_nl.link_name },
          function (data, status) {
            console.log(data);
            console.log(status);

            const toast = new bootstrap.Toast(toastLiveCommented);
            toast.show();
          }
        );

        const offcanvas = bootstrap.Offcanvas.getInstance('#offcanvasBottom');
        offcanvas.hide();
      }



      //水印
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 250;
      const ctx = canvas.getContext('2d');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = 0.05;
      ctx.font = '20px Microsoft Yahei';
      ctx.translate(125, 125);
      ctx.rotate(-Math.PI / 8);
      ctx.fillText('量子星河-星图', 0, 0);
      ctx.save()

      function setWaterMark(t) {
        ctx.restore();
        ctx.fillText(t, 0, 30);
      }

      // Ready
      login_info = {}
      $(window).ready(function () {
        var tooltipTriggerList = document.querySelectorAll('[data-bs-title="反馈建议"]')
        var tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
        var tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        var tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))

        //获取用户信息
        $.getJSON("/qgapp/login_status", {}, function (li) {
          console.log(li);
          login_info = li
          setWaterMark(login_info.user)
        })
        //处理URL自带搜索
        var search_param = {};
        if (keyword = getUrlParamCN("exact_kw")) {
          console.log("精确：" + keyword);
          search_param = { exact_kw: keyword };
        } else if (keyword = getUrlParamCN("vague_kw")) {
          console.log("模糊：" + keyword);
          search_param = { vague_kw: keyword };
        } else if (keyword = getUrlParamCN("code_kw")) {
          console.log("代码：" + keyword);
          search_param = { code_kw: keyword };
        }
        search_param.name = keyword;
        if (keyword) {
          $.getJSON("/qgapp/atlas_query",
            search_param,
            render
          )

        }
      });
    </script>


    <script type="text/javascript">
      all_nodes_map = {};
      all_links_map = {};


      // 基于准备好的dom，初始化echarts实例
      var myChart = echarts.init(document.getElementById('main'));// 指定图表的配置项和数据

      var option0 = {
        backgroundColor: {
          type: 'pattern',
          image: canvas,
          repeat: 'repeat'
        },
        legend: { show: false, left: "right", top: "middle", orient: "vertical", itemGap: 20, icon: "circle", itemHeight: 25 },
        tooltip: { show: false },
        animationDurationUpdate: 1500,
        animationEasingUpdate: 'quinticInOut',
        series: [
          {
            name: 'atlas',
            type: 'graph',
            layout: 'force',
            symbolSize: 50,
            roam: true,
            draggable: true,
            label: {
              show: true,
              formatter: function (params) {
                return params.name.split("_")[0];
              }
            },
            categories: [
              {
                name: "产品",
                itemStyle: { color: "#0362A1", borderColor: "lightskyblue", borderWidth: 0 }
              },
              {
                name: "企业",
                itemStyle: { color: "#FFF", borderColor: "#00AB0B", borderWidth: 3 }
              },
              {
                name: "工艺",
                itemStyle: { color: "#999999", borderColor: "lightskyblue", borderWidth: 0 }
              },
              {
                name: "需求",
                itemStyle: { color: "#CC0000", borderColor: "lightskyblue", borderWidth: 0 }
              },
              {
                name: "指标",
                itemStyle: { color: "#FFFFCC", borderColor: "lightskyblue", borderWidth: 0 }
              }
            ],
            edgeSymbol: ['circle', 'arrow'],
            edgeSymbolSize: [4, 10],
            edgeLabel: {
              show: false,
              fontSize: 14,
            },
            selectedMode: "single", //"multiple",
            select: {
              itemStyle: { borderColor: "lightskyblue", borderWidth: 6 },
              lineStyle: { width: 6 },
              edgeLabel: { show: true },
            },
            lineStyle: {
              opacity: 0.9,
              width: 2,
              curveness: 0
            },
            force: {
              repulsion: 80,
              gravity: 0.01,
              edgeLength: [80, 250],
              fraction: 0.6
            }
          }
        ]
      };

      //myChart.on('finished', function () {
      //  $("#search_btn").text("Search");
      //});
      // 使用刚指定的配置项和数据显示图表。
      myChart.setOption(option0);


      function extract_selected_nl() {
        let relnode = [];
        let rellink = [];
        var selectedMap = myChart.getOption().series[0].selectedMap;
        for (var name in selectedMap) {
          if (selectedMap[name]) {
            if (name.search(" > ") >= 0) {
              rellink.push(name);
            } else {
              relnode.push(name);
            }
          }
        }

        return { node_name: relnode, link_name: rellink };
      }


      //resize
      $(window).resize(function () {
        myChart.resize();
      });


      //获取URL参数
      function getUrlParamCN(name) {
        var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); //构造一个含有目标参数的正则表达式对象
        var r = decodeURI(window.location.search).substr(1).match(reg); //匹配目标参数
        if (r != null) return unescape(r[2]); return null; //返回参数值
      }


    </script>


    <script>
      function render(res) {
        console.log("render");
        console.log(res);
        //let option = JSON.parse(JSON.stringify(option0));
        let option = {};
        //res = { data: { nodes: [], links: [] } }
        var inc_num_n = 0;
        var inc_num_l = 0;

        var nodes = [
          {
            name: 'Node 1',
            category: ["Product"],
          },
          {
            name: 'Node 2',
            category: "Company",
          },
          {
            name: 'Node 3',

          }

        var nodes = res.nodes;
        nodemap_neoid_name = {};
        var i = 0
        nodes.forEach(function (node) {

          }
          node.rawname = node.name;
          node.name = node.rawname + "_" + node.category + "_" + node.neoid;

          nodemap_neoid_name[node.neoid] = node.name;
          //delete node.id
          if (!(node.name in all_nodes_map)) {
            node.show = true;
            all_nodes_map[node.name] = node;
            inc_num_n++;

          }
        });


        var links = [
          {
            source: 0,
            target: 1,
            label: {
              show: true
            }
          },
          {
            source: 'Node 1',
            target: 'Node 3'
          },
          {
            source: 'Node 2',
            target: 'Node 3'
          },
          {
            source: 'Node 2',
            target: 'Node 4',
            category: "储运"
          },
          {
            source: 'Node 1',
            target: 'Node 4',
            category: "父节点"
          }
        ];
        var links = res.links;
        links.forEach(function (link) {
          let a = link.category || "原材料";
          link.source = nodemap_neoid_name[link.source];
          link.target = nodemap_neoid_name[link.target];
          link.label = { formatter: a };
          link.category = a;
          if (link.category == "父节点") {
            link.value = 250;
            link.lineStyle = { color: "#9933FF", width: 2 };
          } else if (link.category == "储运") {
            link.value = 250;
            link.lineStyle = { color: "#FFB366", width: 2 };
          } else if (link.category == "反映") {
            link.value = 350;
          } else if (link.category == "生产") {
            link.value = 350;
          } else {
            link.value = 50;

          }
          var n = link.source + " > " + link.target;


          if (!(n in all_links_map)) {
            link.show = true;
            link.name = n;
            all_links_map[n] = link;
            inc_num_l++;
          }
        });

        var toShowNodes = []
        for (var name in all_nodes_map) {
          node = all_nodes_map[name]
          if (!node.show) {
            continue;
          }
          if (node.name == keyword) {
            node.fixed = true;
            node.x = myChart.getWidth() / 2;
            node.y = myChart.getHeight() / 2;
            node.symbolSize = 75;
          } else {
            node.fixed = false;
            delete node.symbolSize;
          }
          toShowNodes.push(node);
        }

        var toShowLinks = []
        for (var name in all_links_map) {
          link = all_links_map[name]
          if (!link.show) {
            continue;
          }
          toShowLinks.push(link);
        }

        option = {
          series: [{
            data: toShowNodes,
            links: toShowLinks,
            label: {
              show: true,
              formatter: function (params) {
                return all_nodes_map[params.name].rawname;
              },
            }
          }],
          backgroundColor: {
            type: 'pattern',
            image: canvas,
            repeat: 'repeat'
          }
        };
        console.log(option)

        //myChart.clear();
        myChart.setOption(option);
        myChart.hideLoading();
        showSearchResult(inc_num_n, inc_num_l);
        console.log(myChart.getOption());
        onToggleLegend();
      }

      //搜索框发送搜索请求
      function goSearch(event) {
        keyword = $("#kw").val()
        console.log(event);
        if (keyword.length) {
          myChart.showLoading();
          //精确检索
          var search_param = {};
          if ($("#searchmode").text() == "精确") {
            console.log("精确：" + keyword);
            search_param = { exact_kw: keyword };
          } else if ($("#searchmode").text() == "模糊") {
            console.log("模糊：" + keyword);
            search_param = { vague_kw: keyword };
          } else if ($("#searchmode").text() == "代码") {
            console.log("代码：" + keyword);
            search_param = { code_kw: keyword };
          }
          search_param.name = keyword;
          $.getJSON("/qgapp/atlas_query",
            search_param,
            render
          )
        }

      }

      //扩展按钮发送搜索请求
      function goExpandSearch(event) {
        keywords = extract_selected_nl().node_name.map(function (n) {
          return all_nodes_map[n].rawname;
        })
        console.log(keywords);
        if (keywords.length) {
          myChart.showLoading();
          $.getJSON("/qgapp/atlas_query",
            { expand_kws: keywords },
            render
          )
        }
      }

      //图例开关
      function onToggleLegend(event) {
        myChart.setOption({ legend: { show: $("#btncheck2").get(0).checked } });

      }

      // 取消选择    
      function unselectAll(event) {
        var selectedMap = myChart.getOption().series[0].selectedMap;
        for (var k in selectedMap) {
          myChart.dispatchAction({ type: "unselect", name: k })
        }
      }

      // 执行清画布
      function clearScreen(event) {
        all_nodes_map = {};
        all_links_map = {};
        myChart.clear();
        myChart.setOption(option0);
        myChart.hideLoading();
        console.log("clearScreen");
      }
