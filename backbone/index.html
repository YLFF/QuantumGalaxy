  <body style="background: linear-gradient(rgba(255,255,255,0.94),rgba(255,255,255,0.94)), url('static/03.png') fixed center;background-size:450px;">
	<button id="btn-flow" onclick="toggle_flow()" style="position:fixed; z-index:10">动画开关</button>
    <div id="main" style="width: 100%;height:1000px; z-index:5"></div>
	

	
    <script type="text/javascript">
        // 基于准备好的dom，初始化echarts实例
		var chartDom = document.getElementById('main');
		var myChart = echarts.init(chartDom);
		var option;

        // 指定图表的配置项和数据
		
        var option = {
		};

        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
	<script type="text/javascript">
	// 基于准备好的dom，初始化echarts实例
	var graph_g={
		categories: [],
		links: [],
		nodes: [],
	}
	var parents={};
	
	myChart.showLoading();
	
	  myChart.hideLoading();
	  graph = data;
	  console.log(graph)
	  graph.nodes.forEach(function (node) {
	    //node.symbolSize = node.category=="产品"?35:14
		//if (node.name == "三峡能源"){
		//	console.log(123)
		//}
		//node.labels = {
		//  show: true, //node.symbolSize > 30
		//  position: node.symbolSize > 30?'inside':'right'
		//};
		//if(node.isroot && node.category=="产品"){
		//	node.itemStyle = {"borderColor":"red", "borderWidth":2}	
		//}
		//if(node.parents){
		//	node.parents.forEach(function (parent) {
		//		graph.links.push({"name":node.name+"_继承_"+parent,"source":node.name,"target":parent,"category":"继承"});
		//		parents[parent]=node.symbolSize+5;
		//	});			
		//}
	  });
	  
	  graph.nodes.forEach(function (node) {
		node.category=node.labels[0]
		node.value=node.stock
		if(node.name in parents){
			node.itemStyle = {
				color:"rgba(255,255,255,0)",
				borderColor:'#000',
				borderType:'dashed',
			};
			node.labels = {
				show: true,
				color:"#7294B5",
		  		position: node.symbolSize > 30?'inside':'right',
				fontSize: 15,
				textBorderColor: "#fff",
				textBorderWidth: 2,
			};
			//node.symbolSize = parents[node.name];
		}
	  });
	  
	  graph.links.forEach(function (link) {
		link.value = link.velocity
	    if(link.relationship=="compose"){
		  
		  link.lineStyle = {
			  width: 3,
			  type: [13, 3],
			}
		}else if(link.relationship=="peer"){
	      //link.value = 21
		  link.symbol = "none"
		  link.lineStyle = {width: 1}
		}else if(link.relationship=="carry"){
	      //link.value = 25
		  link.show = false
		  link.symbol=["", "circle"]	
		  link.ignoreForceLayout=false
		}else if(link.relationship=="produce"){
	      //link.value = 23
		}else{
	      //link.value = 1
		}
	  });

	  graph_g = graph;


	  //
	  option = {
		title: {
		  text: '量子星河骨干研究Demo',
		  subtext: graph.ts,
		  right: "2%",
		  textAlign: "right",
		},
		tooltip: {
			enterable: true,
			position: [20, 10],
		},
		legend: [
		  {
			selectedMode: 'single',
			data: graph.categories.map(function (a) {
			  return a.name;
			})
		}
		],
		animationDuration: 1500,
		animationEasingUpdate: 'quinticInOut',
		series: [
		  {
			name: '量子星河骨干Demo',
			type: 'graph',
			layout: 'force', 
			legendHoverLink: false,
			draggable: true,
			autoCurveness: true,
			data: graph.nodes,
			links: graph.links,
			categories: graph.categories,
			roam: true,
			label: {
			  position: 'right'
			},
			edgeLabel: {},
		    edgeSymbol: ['none', 'arrow'],
			selectedMode: 'multiple',
			labelLayout: {
				hideOverlap: true,
			},
			emphasis: {
				focus: 'adjacency',
				lineStyle: {
					width: 6
				}
			},
			force: {
			  repulsion: 0,
			  edgeLength: [15, 110],
			  gravity: 0.01,

			}
		  }
		]
	  };


	  //
	  myChart.setOption(option);
	  myChart.dispatchAction({
		type: 'legendUnSelect',
		// 图例名称
		name: "公司"
	  })
	  
	option && myChart.setOption(option);
	
	offset = 0;
	timerMarch = 0;
	function march() {
		offset = offset==0? 15: offset-1;
	    myChart.setOption({series:{
			name: '量子星河骨干Demo',
			lineStyle:{
				dashOffset: offset,
			},
		}},{lazyUpdate: true});
		timerMarch = setTimeout(march, 25);
	}

	function toggle_flow(){

		if (timerMarch){
			clearTimeout(timerMarch)
			timerMarch = 0
		}else{
			march();
		}

	}
    </script>
